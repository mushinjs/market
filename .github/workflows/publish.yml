name: Publish the index

# Rebuilds the market index from npm every 30 minutes (and on every push to main) and publishes it to GitHub Pages,
# where dashboards read https://mushinjs.github.io/market/index.json.

on:
  push:
    branches: [main]
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - run: npm test
      - run: npm run build
      - name: Keep the last index when the build found nothing
        run: |
          count=$(node -p "require('./public/index.json').packages.length")
          if [ "$count" -eq 0 ]; then
            echo "The registry returned no packages; not publishing an empty index." >&2
            exit 1
          fi
      - uses: actions/upload-pages-artifact@v3
        with:
          path: public

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
